map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# go2rtc treats an unknown `src` as a source definition. Only platform-issued
# relay names use this charset; rejecting schemes and punctuation prevents the
# public playback socket from becoming a relay configuration surface.
map $arg_src $valid_relay_name {
  default 0;
  ~^[A-Za-z0-9_-]+$ 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 24m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  location = / {
    return 302 /robots/;
  }

  location = /robots {
    return 302 /robots/;
  }

  location ^~ /robots/api/ {
    proxy_pass http://api:8787/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /robots/ws {
    auth_request /_plantbot_session_auth;
    proxy_pass http://api:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  location ^~ /robots/media/ {
    proxy_pass http://api:8787/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
  }

  # Internal session check for the go2rtc playback socket. /api/sites returns
  # 401 without a valid pb_sess cookie when PB_PUBLIC_VIEW=0.
  location = /_plantbot_session_auth {
    internal;
    proxy_pass http://api:8787/api/sites;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Browser playback needs only the MSE WebSocket. Never publish go2rtc's
  # unauthenticated management endpoints under /api/streams or /api/config.
  location = /robots/stream/api/ws {
    if ($valid_relay_name = 0) { return 400; }
    auth_request /_plantbot_session_auth;
    proxy_pass http://relay:1984/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  location ^~ /robots/stream/ {
    return 404;
  }

  location ^~ /robots/assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
  }

  location = /robots/index.html {
    try_files $uri =404;
    expires -1;
  }

  location /robots/ {
    try_files $uri $uri/ /robots/index.html;
  }
}
