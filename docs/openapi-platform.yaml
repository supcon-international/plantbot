      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/plans:
    parameters:
      - $ref: "#/components/parameters/siteId"
    post:
      tags:
        - media
      operationId: createPtzPlan
      summary: Create an ordered preset patrol and schedule (operator)
      description: Maximum 200 plans per site. Enabled interval plans first run after their interval. Once requires
        a future epoch timestamp. Weekly times and days use UTC. Unsupported cameras can save disabled plans
        only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PtzPlanInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/PtzPlan"
        "400":
          description: Invalid stops or cadence
        "409":
          description: Absolute positioning unavailable or plan capacity reached
      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/plans/{id}:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - media
      operationId: updatePtzPlan
      summary: Replace plan configuration or toggle its enabled flag (operator)
      description: Does not change an already running record. Changing cadence or enabling recalculates the next run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PtzPlanInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/PtzPlan"
        "400":
          description: Invalid input
        "404":
          description: Plan missing
        "409":
          description: Absolute positioning unavailable
      security:
        - cookieAuth: []
    delete:
      tags:
        - media
      operationId: deletePtzPlan
      summary: Delete an inactive plan while retaining execution records (operator)
      responses:
        "200":
          description: Deleted
        "404":
          description: Plan missing
        "409":
          description: Cancel its active run first
      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/plans/{id}/run:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - media
      operationId: runPtzPlan
      summary: Run a plan now without altering its schedule (operator)
      responses:
        "200":
          description: Run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/PtzRun"
        "404":
          description: Plan missing
        "409":
          description: Camera busy
          interlocked or unsupported: null
      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/manual:
    parameters:
      - $ref: "#/components/parameters/siteId"
    post:
      tags:
        - media
      operationId: manualPtzCommand
      summary: Send the documented reset command to a relative-only camera (operator)
      description: Vendor acceptance is recorded; it does not prove camera position. GS F2 supports reset (opcode
        12). Directional and zoom movements are rejected because the documented protocol requires a stop message
        without specifying its opcode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channelId
                - mode
              properties:
                channelId:
                  type: string
                mode:
                  type: string
                  enum:
                    - home
                pan:
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                tilt:
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                zoom:
                  type: number
                  minimum: -9
                  maximum: 9
                  default: 0
      responses:
        "200":
          description: Run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/PtzRun"
        "400":
          description: Invalid mode or values
        "409":
          description: Camera busy or adapter lacks directional control
      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/runs:
    parameters:
      - $ref: "#/components/parameters/siteId"
    get:
      tags:
        - media
      operationId: queryPtzRuns
      summary: Query all historical records using time filters and an opaque descending cursor
      parameters:
        - name: channelId
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: Inclusive start epoch milliseconds
          schema:
            type: integer
            minimum: 0
        - name: until
          in: query
          description: Inclusive end epoch milliseconds
          schema:
            type: integer
            minimum: 0
        - name: before
          in: query
          description: nextCursor from the previous page
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Records, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PtzRun"
                  nextCursor:
                    type: integer
                    nullable: true
        "400":
          description: Invalid cursor or filters
  /api/sites/{siteId}/ptz/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - media
      operationId: cancelPtzRun
      summary: Cancel further stops and retract pending commands (operator)
      description: Commands already delivered cannot be physically recalled. Delivered control without an arrival
        receipt keeps the camera interlocked until verified. Completed arrival receipts remain unchanged.
      responses:
        "200":
          description: Current run
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/PtzRun"
        "404":
          description: Run missing
      security:
        - cookieAuth: []
  /api/sites/{siteId}/ptz/runs/{id}/release:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - media
      operationId: releasePtzInterlock
      summary: Record operator verification that an interrupted camera has stopped
      description: Releases the platform reservation only. Does not send a physical stop command. The operator
        identity is appended to the run record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmedStopped
              properties:
                confirmedStopped:
                  type: boolean
                  enum:
                    - true
      responses:
        "200":
          description: Current run
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/PtzRun"
        "400":
          description: Stop verification required
        "404":
          description: Run missing
      security:
        - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_sess
      description: HMAC-signed session cookie from /api/auth/login or the OIDC flow

  parameters:
    siteId: { name: siteId, in: path, required: true, schema: { type: string, example: plant-07 } }
    robotId: { name: id, in: path, required: true, schema: { type: string, example: ext-bd-91250107 } }
    id: { name: id, in: path, required: true, schema: { type: string } }

  responses:
    Forbidden: { description: requires a higher role on this site }
    NotFound: { description: not found }
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    MissionEnvelope:
      description: the affected mission
      content:
        application/json:
          schema:
            type: object
            properties:
              mission: { $ref: "#/components/schemas/Mission" }
    ConnectorEnvelope:
      description: the connector record (with live runtime)
      content:
        application/json:
          schema:
            type: object
            properties:
              connector: { $ref: "#/components/schemas/Connector" }

  schemas:
    Role: { type: string, enum: [viewer, operator, admin] }
    RoleMap:
      type: object
      description: "siteId (or '*') → role"
      additionalProperties: { $ref: "#/components/schemas/Role" }
    User:
      type: object
      properties:
        username: { type: string }
        displayName: { type: string }
        roles: { $ref: "#/components/schemas/RoleMap" }
    Bounds:
      type: object
      properties:
        x: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        z: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
    SiteInfo:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        operator: { type: string }
        bounds: { $ref: "#/components/schemas/Bounds" }
    Waypoint:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        x: { type: number }
        z: { type: number }
        kind: { type: string }
    Zone:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
    Camera:
      type: object
      description: rtsp field present only for site admins
      properties:
        id: { type: string }
        name: { type: string }
        place: { type: string }
        stream: { type: string }
        live: { type: boolean }
        rtsp: { type: string }
    Robot:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        serial: { type: string }
        callsign: { type: string }
        model: { type: string }
        family: { type: string, enum: [quadruped, ugv] }
        adapter: { type: string, enum: [sim, external] }
        integrationLevel: { type: string, enum: [state-only, dispatchable] }
    MissionStep:
      type: object
      required: [waypointId]
      properties:
        waypointId: { type: string }
        actions:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              durationS: { type: number }
    Mission:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [queued, active, done, failed, aborted] }
        robotId: { type: string }
        progress: { type: number }
        steps: { type: array, items: { $ref: "#/components/schemas/MissionStep" } }
    Event:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        ts: { type: integer }
        type: { type: string }
        label: { type: string }
        severity: { type: string, enum: [critical, high, info, low] }
        category: { type: string, enum: [security, fire, env, equipment, robot-fault] }
        lifecycle: { type: string, enum: [new, acked, resolved, dismissed] }
        x: { type: number }
        z: { type: number }
    Channel:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        role: { type: string }
        label: { type: string }
        codec: { type: string }
        streamKey: { type: string }
        ptz: { $ref: "#/components/schemas/PtzCapability" }
        source:
          type: object
          properties:
            kind: { type: string, enum: [file, rtsp, hls, webrtc] }
            url: { type: string, description: 'redacted (empty) for rtsp on non-admin surfaces' }
    StreamSession:
      type: object
      properties:
        id: { type: string }
        channelId: { type: string }
        url: { type: string, description: file path (file) or go2rtc stream name (mse) }
        protocol: { type: string, enum: [file, hls, webrtc, rtsp, mse] }
        relayOnline: { type: boolean, description: "mse only — false when no MEDIA_RELAY is configured" }
        createdAt: { type: integer }
        expiresAt: { type: integer, nullable: true, description: null for static demo loops (never expire) }
    Command:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string, enum: [goto, dock, pause, resume, abort, announce, ptz] }
        mode: { type: string, enum: [absolute, relative, home], description: "PTZ only; explicit capability and range validation apply" }
        channelId: { type: string, description: "PTZ channel id for this robot" }
        pan: { type: number, description: "Absolute mode degrees, positive right" }
        tilt: { type: number, description: "Absolute mode degrees, positive up" }
        zoom: { type: number, description: "Absolute mode optical magnification, 1 = wide" }
    MetricDef:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        kind: { type: string }
        decimals: { type: integer, description: display precision for the UI }
    Reading:
      type: object
      properties:
        robotId: { type: string }
        payloadId: { type: string }
        metric: { type: string }
        value: { type: number }
        ts: { type: integer, description: epoch ms }
        quality: { type: string, enum: [ok, degraded, stale] }
        wp: { type: string, description: waypoint the reading was taken at }
    MapAsset:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        kind: { type: string, enum: [occupancy, aerial] }
        name: { type: string }
        url: { type: string }
        occupancy:
          type: object
          description: present on occupancy grids (ROS map_server convention)
          properties:
            resolution: { type: number, description: meters per pixel }
            origin: { type: array, items: { type: number }, description: "world [x,z] of the top-left pixel" }
            width: { type: integer }
            height: { type: integer }
    FrameTransform:
      type: object
      additionalProperties: true
      description: "similarity transform: p_to = s·R(θ)·p_from + t"
      properties:
        id: { type: string, description: "present on stored transforms; the occupancy-derived map:occupancy→world transform has no id" }
        from: { type: string }
        to: { type: string }
        params:
          type: object
          properties:
            s: { type: number }
            thetaRad: { type: number }
            t: { type: array, items: { type: number } }
    Cadence:
      description: "once | interval | weekly"
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [once] }
            at: { type: integer, description: epoch ms (optional) }
        - type: object
          required: [kind, everyMin]
          properties:
            kind: { type: string, enum: [interval] }
            everyMin: { type: number, description: positive minutes between runs }
        - type: object
          required: [kind, days, at]
          properties:
            kind: { type: string, enum: [weekly] }
            days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Sunday … 6 = Saturday" }
            at: { type: string, description: "HH:MM local time" }
    Schedule:
      type: object
      properties:
        id: { type: string, example: SC-02 }
        templateId: { type: string }
        assign:
          type: object
          properties:
            kind: { type: string, enum: [auto, robot] }
            robotId: { type: string }
        cadence: { $ref: "#/components/schemas/Cadence" }
        priority: { type: integer, enum: [1, 2, 3] }
        enabled: { type: boolean }
        lastRunAt: { type: integer, nullable: true }
        nextRunAt: { type: integer, nullable: true }
        runCount: { type: integer }
    MissionTemplate:
      type: object
      properties:
        id: { type: string, example: T-03 }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/MissionStep" } }
        requires: { type: array, items: { type: string }, description: payload kinds a runner must carry }
        builtin: { type: boolean }
        createdAt: { type: integer }
    ApiKey:
      type: object
      description: key metadata only — the plaintext is returned once, on creation
      properties:
        id: { type: string }
        label: { type: string }
        prefix: { type: string, description: "leading chars of the key (e.g. pbk_ab12…)" }
        createdAt: { type: integer }
        lastUsedAt: { type: integer, nullable: true }
    ConnectorRuntime:
      type: object
      properties:
        status: { type: string, enum: [running, backoff, stopped] }
        pid: { type: integer }
        restarts: { type: integer }
        since: { type: integer, nullable: true }
        lastExit: { type: string, nullable: true }
    Connector:
      type: object
      additionalProperties: true
      description: managed connector record (config carries credentials — admin-only route)
      properties:
        id: { type: string }
        siteId: { type: string }
        vendor: { type: string, enum: [spot, deeprobotics, gosuncn] }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        runtime: { $ref: "#/components/schemas/ConnectorRuntime" }

    RecordingPolicy:
      type: object
      properties:
        channelId:
          type: string
        enabled:
          type: boolean
        retentionDays:
          type: integer
          minimum: 1
          maximum: 30
        recording:
          type: boolean
        error:
          type: string
          nullable: true
          description: Sanitized failure description; never includes source credentials
    Recording:
      type: object
      properties:
        id:
          type: string
        channelId:
          type: string
        label:
          type: string
        startedAt:
          type: integer
        endedAt:
          type: integer
        bytes:
          type: integer
        url:
          type: string
          description: PUBLIC_BASE-prefixed protected video route
    InspectionAssetInput:
