  /api/sites/{siteId}/defects/{id}/updates:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - events
      summary: Record treatment, close or reopen a defect (operator)
      description: Every update requires a nonblank note. Starting work or closing requires a responsible operator.
        Closing stores the note as the resolution; reopening clears the current resolution but retains all
        history. A comment on a closed record does not rewrite its closing statement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - note
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 8000
                status:
                  type: string
                  enum:
                    - open
                    - in_progress
                    - closed
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionDefect"
        "400":
          description: Invalid fields, references or transition preconditions
        "401":
          description: Sign-in required
        "403":
          description: Insufficient site role
        "404":
          description: Site or record not found
        "409":
          description: Duplicate name, referenced record or closed defect conflict
      security:
        - cookieAuth: []
