  /api/organization/units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - platform
      summary: Update an organization unit (platform admin)
      description: The hierarchy cannot contain cycles or use positions as parents. A factory has no parent. A
        referenced unit cannot change type. Empty parentId or siteId clears that relation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                kind:
                  type: string
                  enum:
                    - factory
                    - department
                    - position
                parentId:
                  type: string
                siteId:
                  type: string
      responses:
        "200":
          description: Updated unit
        "400":
          description: Invalid hierarchy or fields
        "404":
          description: Unit not found
        "409":
          description: Type change blocked by children or member assignments
      security:
        - cookieAuth: []
    delete:
      tags:
        - platform
      summary: Delete an unreferenced organization unit (platform admin)
      responses:
        "200":
          description: Deleted
        "404":
          description: Unit not found
        "409":
          description: Unit has children or assigned members
      security:
        - cookieAuth: []
  /api/organization/members/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
