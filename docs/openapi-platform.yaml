        "404":
          description: User not found
      security:
        - cookieAuth: []
  /api/audit-log:
    get:
      tags:
        - platform
      summary: Query server-recorded login and operation outcomes (platform admin)
      description: Records session mutations, report exports, local sign-in attempts and OIDC login/callback
        outcomes. Integration telemetry is excluded. Only actor, route template, selected target IDs, site and
        HTTP status are stored; no bodies, headers, query strings, session cookies, passwords or keys. Retained
        for 90 days, newest first.
