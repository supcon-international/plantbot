          type: string
    OperationAudit:
      type: object
      required:
        - id
        - ts
        - actor
        - action
        - target
        - status
      properties:
        id:
          type: integer
        ts:
          type: integer
        actor:
          type: string
        action:
          type: string
          description: HTTP method and route template
        siteId:
          type: string
          nullable: true
        target:
          type: string
        status:
          type: integer
          description: Actual HTTP response status
    PtzCapability:
      type: object
      required:
        - absolute
        - pan
        - tilt
        - zoom
      description: Declared by adapter factsheet streams[].ptz. Absolute means calibrated degrees for pan/tilt and
        optical zoom multiplier; adapter must send done only after arrival feedback. Relative-only ranges describe
        vendor control input, not a position.
      properties:
        absolute:
          type: boolean
        pan:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        tilt:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        zoom:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
    PtzPresetInput:
      type: object
      required:
        - name
        - channelId
        - pan
        - tilt
        - zoom
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        channelId:
          type: string
        pan:
          type: number
          description: Degrees within adapter range; draft fallback -360..360
        tilt:
          type: number
          description: Degrees within adapter range; draft fallback -180..180
        zoom:
          type: number
          description: Optical multiplier within adapter range; draft fallback 1..100
    PtzPreset:
      allOf:
        - $ref: "#/components/schemas/PtzPresetInput"
        - type: object
          properties:
            id:
              type: string
            createdAt:
              type: integer
            updatedAt:
              type: integer
    PtzCadence:
      oneOf:
        - type: object
          required:
            - kind
            - at
          properties:
            kind:
              type: string
              enum:
                - once
            at:
              type: integer
              description: Epoch milliseconds
        - type: object
          required:
            - kind
            - everyMin
          properties:
            kind:
              type: string
              enum:
                - interval
            everyMin:
              type: number
              minimum: 1
              maximum: 525600
        - type: object
          required:
            - kind
            - days
            - at
          properties:
            kind:
              type: string
              enum:
                - weekly
            days:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: integer
                minimum: 0
                maximum: 6
              description: UTC weekdays; Sunday is 0
            at:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
              description: UTC HH:mm
    PtzPlanInput:
      type: object
      required:
        - name
        - channelId
        - steps
        - cadence
        - enabled
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        channelId:
          type: string
        enabled:
          type: boolean
        cadence:
          $ref: "#/components/schemas/PtzCadence"
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - presetId
              - dwellS
            properties:
              presetId:
                type: string
              dwellS:
                type: number
                minimum: 1
                maximum: 3600
    PtzPlan:
      allOf:
        - $ref: "#/components/schemas/PtzPlanInput"
        - type: object
          properties:
            id:
              type: string
            nextRunAt:
              type: integer
            createdAt:
              type: integer
            updatedAt:
              type: integer
    PtzRun:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        name:
          type: string
        channelId:
          type: string
        robotId:
          type: string
        by:
          type: string
        status:
          type: string
          enum:
            - running
            - done
            - failed
            - cancelled
        mode:
          type: string
          enum:
            - absolute
            - relative
            - home
        interlocked:
          type: boolean
        stepIndex:
          type: integer
        startedAt:
          type: integer
        endedAt:
          type: integer
        note:
          type: string
        steps:
          type: array
          items:
            type: object
            description: Immutable target snapshot with adapter receipt timestamps. No automatic image or algorithm
              capture is implied.
            properties:
              presetId:
                type: string
              name:
                type: string
              pan:
                type: number
              tilt:
                type: number
              zoom:
                type: number
              dwellS:
                type: number
              orderId:
                type: string
              sentAt:
                type: integer
              arrivedAt:
                type: integer
                description: For relative mode this means vendor acceptance only
              completedAt:
                type: integer
              note:
                type: string
