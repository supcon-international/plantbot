      summary: Update defect details or assignment (operator)
      description: Closed defects must be reopened before editing. Every changed field records before/after values,
        actor and timestamp. Submitted-by identity and history cannot be supplied or overwritten. An existing
        event link remains editable after the source event expires under event retention; a new or changed event
        link must exist in this site.
