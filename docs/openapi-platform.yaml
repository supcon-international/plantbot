openapi: 3.0.3
info:
  title: Plantbot Platform API (session face)
  version: "1.0"
  description: |
    The complete browser/session-facing API — everything the Plantbot console
    itself uses, documented for host webapps that embed Plantbot (iframe) or
    drive it on behalf of signed-in users.

    **Auth**: HMAC-signed session cookie `pb_sess`, obtained via
    `POST /api/auth/login` (password) or the OIDC SSO flow
    (`GET /api/auth/oidc/login` → IdP → callback). Roles are
    `viewer < operator < admin`, granted per site (or `*` platform-wide).
    Anonymous requests carry the viewer role unless the deployment sets
    `PB_PUBLIC_VIEW=0`. For cross-site iframes set `PB_COOKIE_SAMESITE=none`
    (HTTPS required).

    **Realtime**: `GET /ws?site=<siteId>` (WebSocket) opens with a `hello`
    snapshot, then pushes frames tagged by a `t` field — the same data plane the
    console renders. Frame types (`t`): `hello`, `tel` (telemetry, 4 Hz),
    `site`, `geo`, `fleet`, `event`, `lifecycle`, `readings`, `command`,
    `missions`, `schedules`, `templates`, `rules`, `eventTypes`, `channels`,
    `maps`.

    The machine-to-machine integration face (`/api/integration/v1`, Bearer
    site key) is a separate spec: `docs/openapi.yaml`, served live at
    `GET /api/integration/v1/openapi.json`.
servers:
  - url: /
tags:
  - { name: auth, description: "sessions, OIDC SSO" }
  - { name: platform, description: "sites & users (platform admin)" }
  - { name: site, description: "per-site model — geometry, cameras, maps, transforms" }
  - { name: fleet, description: "robots, telemetry, commands" }
  - { name: missions, description: "templates, schedules, runs" }
  - { name: events, description: "event stream, lifecycle, rules, vocabulary" }
  - { name: media, description: "channels, stream sessions, snapshots" }
  - { name: integrations, description: "API keys, managed connectors" }

security:
  - cookieAuth: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Password sign-in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session cookie issued (Set-Cookie pb_sess)
          content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } } } }
        "401": { description: invalid credentials }
        "429": { description: throttled — 5 failures / 15 min per ip+user }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out (clears the session cookie)
      operationId: logout
      responses:
        "200": { description: ok }

  /api/auth/oidc/login:
    get:
      tags: [auth]
      security: []
      summary: Begin OIDC SSO (Authorization Code + PKCE)
      description: 302 to the configured IdP. Enabled when the deployment sets OIDC_ISSUER + OIDC_CLIENT_ID.
      operationId: oidcLogin
      parameters:
        - { name: next, in: query, description: "in-app path to land on after sign-in (default /)", schema: { type: string } }
      responses:
        "302": { description: redirect to the IdP authorization endpoint }
        "404": { description: SSO not configured }
        "502": { description: IdP discovery failed }

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      security: []
      summary: OIDC redirect URI
      description: Validates state, exchanges the code, verifies the ID token against the IdP JWKS, JIT-provisions the user and issues the pb_sess session.
      operationId: oidcCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: session issued — redirect into the SPA }
        "400": { description: state mismatch }
        "401": { description: token exchange / validation failed }

  /api/auth/me:
    get:
      tags: [auth]
      security: []
      summary: Who am I — session, SSO availability, site roles
      operationId: me
      responses:
        "200":
          description: Session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User", nullable: true }
                  publicView: { type: boolean, description: anonymous browsing allowed }
                  demo: { type: boolean }
                  sso:
                    type: object
                    nullable: true
                    properties: { label: { type: string } }
                  sites:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        operator: { type: string }
                        role: { $ref: "#/components/schemas/Role" }

  /api/health:
    get:
      tags: [platform]
      security: []
      summary: Liveness + relay status
      operationId: health
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ts: { type: integer }
                  demo: { type: boolean }
                  relay: { type: boolean, description: MEDIA_RELAY configured }
                  relayOnline: { type: boolean, description: go2rtc actually answering probes }
                  sites: { type: array, items: { type: string } }

  /api/openapi.json:
    get:
      tags: [platform]
      security: []
      summary: This document (session-face OpenAPI 3.0 spec)
      description: The machine-readable spec for the session face — parsed from docs/openapi-platform.yaml at boot, served without auth.
      operationId: platformOpenapi
      responses:
        "200":
          description: OpenAPI document
          content: { application/json: { schema: { type: object } } }

  /api/users:
    get:
      tags: [platform]
      summary: List users (platform admin)
      operationId: listUsers
      responses:
        "200": { description: users, content: { application/json: { schema: { type: object, properties: { users: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [platform]
      summary: Create user (platform admin)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, roles]
              properties:
                username: { type: string }
                displayName: { type: string }
                password: { type: string }
                roles: { $ref: "#/components/schemas/RoleMap" }
      responses:
        "200": { description: created }
        "400": { description: invalid / duplicate username }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{username}:
    parameters: [{ name: username, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [platform]
      summary: Update user (display name / roles / password)
      operationId: updateUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                password: { type: string }
                roles: { $ref: "#/components/schemas/RoleMap" }
      responses:
        "200": { description: updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [platform]
      summary: Delete user
      operationId: deleteUser
      responses:
        "200": { description: deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites:
    get:
      tags: [platform]
      security: []
      summary: List sites
      operationId: listSites
      responses:
        "200":
          description: sites with the caller's role on each
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        operator: { type: string }
                        role: { $ref: "#/components/schemas/Role" }
                        demo: { type: boolean, description: seeded demo site }
                        robots: { type: integer, description: registered robot count }
                        openAlerts: { type: integer, description: new critical/high events }
    post:
      tags: [platform]
      summary: Create a site (starts its World immediately)
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string, description: slug — derived from name when omitted }
                name: { type: string }
                operator: { type: string }
                bounds: { $ref: "#/components/schemas/Bounds" }
      responses:
        "200":
          description: created + World started
          content:
            application/json:
              schema:
                type: object
                properties:
                  site:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      operator: { type: string }
        "400": { description: name required / invalid id }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: id exists }

  /api/sites/{siteId}/meta:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    patch:
      tags: [site]
      summary: Rename / rebound a site (admin)
      operationId: patchSite
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                operator: { type: string }
                bounds: { $ref: "#/components/schemas/Bounds" }
      responses:
        "200": { description: updated (WS `site` frame broadcast) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    delete:
      tags: [site]
      summary: Delete a site (stops World, connectors, WS room; cascades rows)
      operationId: deleteSite
      responses:
        "200": { description: deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/geometry:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    put:
      tags: [site]
      summary: Replace site geometry (Site Builder save — live effect, WS `geo` frame)
      operationId: putGeometry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                waypoints: { type: array, items: { $ref: "#/components/schemas/Waypoint" } }
                zones: { type: array, items: { $ref: "#/components/schemas/Zone" } }
                cameras: { type: array, items: { $ref: "#/components/schemas/Camera" } }
                dockWp: { type: string }
                bounds: { $ref: "#/components/schemas/Bounds" }
      responses:
        "200":
          description: applied (WS `geo` frame broadcast)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  waypoints: { type: integer }
                  zones: { type: integer }
                  cameras: { type: integer }
        "400": { description: duplicate waypoint ids, or dockWp not in the waypoint list }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/cameras:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    post:
      tags: [site]
      summary: Add a fixed RTSP camera (admin)
      operationId: addCamera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                place: { type: string }
                rtsp: { type: string, description: "rtsp:// source (may embed credentials — admin-only on read-back)" }
      responses:
        "200":
          description: created (response carries no rtsp plaintext)
          content:
            application/json:
              schema:
                type: object
                properties:
                  camera: { $ref: "#/components/schemas/Camera" }
                  ok: { type: boolean }
        "400": { description: name required, or rtsp:// required when set }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/cameras/{camId}:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { name: camId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [site]
      summary: Edit a camera in place (admin — server-side mutation protects rtsp secrets)
      operationId: patchCamera
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                place: { type: string }
                rtsp: { type: string, description: empty string clears the source }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { description: rtsp:// required when set }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [site]
      summary: Remove a camera (admin)
      operationId: deleteCamera
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/map:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    post:
      tags: [site]
      summary: Upload the occupancy base map (admin, ROS map_server convention)
      operationId: uploadSiteMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, origin, image]
              properties:
                name: { type: string }
                resolution: { type: number, description: meters/pixel }
                origin: { type: array, items: { type: number }, description: "world [x,z] of the top-left pixel" }
                image: { type: string, description: "PNG data URL, ≤ 8 MB" }
      responses:
        "200": { description: stored + broadcast }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/map-image:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [site]
      security: []
      summary: The uploaded occupancy PNG
      operationId: siteMapImage
      responses:
        "200": { description: PNG, content: { image/png: {} } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/transforms:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [site]
      summary: Stored calibration transforms
      operationId: listTransforms
      responses:
        "200": { description: transforms, content: { application/json: { schema: { type: object, properties: { transforms: { type: array, items: { $ref: "#/components/schemas/FrameTransform" } } } } } } }
    post:
      tags: [site]
      summary: Save a calibration transform (admin — CALIB page)
      operationId: saveTransform
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FrameTransform" } } }
      responses:
        "200":
          description: saved (WS `maps` frame broadcast)
          content:
            application/json:
              schema:
                type: object
                properties:
                  transform: { $ref: "#/components/schemas/FrameTransform" }
        "400": { description: "from, to, params {s, thetaRad, t:[x,z]} required" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/transforms/{id}:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [site]
      summary: Delete a transform (admin)
      operationId: deleteTransform
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/maps:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [site]
      summary: Map inventory + transforms (occupancy underlay, calibration params)
      operationId: siteMaps
      responses:
        "200":
          description: maps + transforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  maps: { type: array, items: { $ref: "#/components/schemas/MapAsset" } }
                  transforms: { type: array, items: { $ref: "#/components/schemas/FrameTransform" } }

  /api/sites/{siteId}/fleet:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [fleet]
      summary: Site snapshot — robots, cameras, geometry (rtsp plaintext only for admins)
      operationId: siteFleet
      responses:
        "200":
          description: fleet snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { $ref: "#/components/schemas/SiteInfo" }
                  robots: { type: array, items: { $ref: "#/components/schemas/Robot" } }
                  cameras: { type: array, items: { $ref: "#/components/schemas/Camera" } }
                  waypoints: { type: array, items: { $ref: "#/components/schemas/Waypoint" } }
                  zones: { type: array, items: { $ref: "#/components/schemas/Zone" } }
                  buildings: { type: array, items: { type: object, additionalProperties: true } }
                  dockWp: { type: string }

  /api/sites/{siteId}/catalog:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [fleet]
      summary: Robot onboarding catalog (models with a vendor adapter)
      operationId: catalog
      responses:
        "200": { description: models, content: { application/json: { schema: { type: object, properties: { models: { type: array, items: { type: object, additionalProperties: true } } } } } } }

  /api/sites/{siteId}/external-robots/{id}:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { $ref: "#/components/parameters/robotId" }
    delete:
      tags: [fleet]
      summary: Deregister an external robot (admin)
      operationId: removeExternal
      responses:
        "200": { description: removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/robots/{id}/goto:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { $ref: "#/components/parameters/robotId" }
    post:
      tags: [fleet]
      summary: Tap-to-dispatch (operator) — world-frame target
      operationId: goto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, z]
              properties:
                x: { type: number }
                z: { type: number }
      responses:
        "200": { description: goto order queued }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: unknown robot or state-only unit }

  /api/sites/{siteId}/robots/{id}/commands:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { $ref: "#/components/parameters/robotId" }
    post:
      tags: [fleet]
      summary: Semantic command (operator) — dock/pause/resume/abort/announce/ptz…
      operationId: command
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Command" } } }
      responses:
        "200": { description: command record (accepted or refused with reason) }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [fleet]
      summary: Command audit for one robot
      operationId: commandLog
      responses:
        "200": { description: recent command records }

  /api/sites/{siteId}/robots/{id}/readings:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { $ref: "#/components/parameters/robotId" }
      - { name: metric, in: query, description: filter to one metric id, schema: { type: string } }
      - { name: since, in: query, description: "epoch ms (default 0 — all retained)", schema: { type: integer } }
      - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 } }
    get:
      tags: [fleet]
      summary: Payload reading time series (from SQLite — survives restarts, 7 d retention)
      operationId: robotReadings
      responses:
        "200":
          description: metric ids this robot emits + the reading rows (oldest-first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics: { type: array, items: { type: string }, description: metric ids the robot's payloads emit }
                  readings: { type: array, items: { $ref: "#/components/schemas/Reading" } }

  /api/sites/{siteId}/metrics:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [fleet]
      summary: Reading-metric registry
      operationId: metricRegistry
      responses:
        "200": { description: metric definitions, content: { application/json: { schema: { type: object, properties: { metrics: { type: array, items: { $ref: "#/components/schemas/MetricDef" } } } } } } }

  /api/sites/{siteId}/missions:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [missions]
      summary: Mission runs (live + history)
      operationId: listMissions
      responses:
        "200": { description: missions, content: { application/json: { schema: { type: object, properties: { missions: { type: array, items: { $ref: "#/components/schemas/Mission" } } } } } } }
    post:
      tags: [missions]
      summary: Create + queue a mission (operator)
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, steps]
              properties:
                name: { type: string }
                priority: { type: integer, enum: [1, 2, 3] }
                requestedRobot: { type: string, description: 'robot id or "auto"' }
                recurring: { type: boolean }
                steps: { type: array, items: { $ref: "#/components/schemas/MissionStep" } }
      responses:
        "200":
          description: queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission: { $ref: "#/components/schemas/Mission" }
        "400": { description: "name and steps[] required" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/missions/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [missions], summary: Pause a running mission (operator), operationId: pauseMission, responses: { "200": { $ref: "#/components/responses/MissionEnvelope" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/missions/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [missions], summary: Resume a paused mission (operator), operationId: resumeMission, responses: { "200": { $ref: "#/components/responses/MissionEnvelope" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/missions/{id}/abort:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [missions], summary: Abort a mission (operator), operationId: abortMission, responses: { "200": { $ref: "#/components/responses/MissionEnvelope" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/mission-templates:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [missions]
      summary: Route templates
      operationId: listTemplates
      responses:
        "200":
          description: templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/MissionTemplate" } }
    post:
      tags: [missions]
      summary: Create a template (operator)
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, steps]
              properties:
                name: { type: string }
                steps: { type: array, items: { $ref: "#/components/schemas/MissionStep" } }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { $ref: "#/components/schemas/MissionTemplate" }
        "400": { description: "name and steps[] required" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/sites/{siteId}/mission-templates/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    delete: { tags: [missions], summary: Delete a template (operator), operationId: deleteTemplate, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/schedules:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [missions]
      summary: Schedules (creation takes effect immediately — no publish step)
      operationId: listSchedules
      responses:
        "200":
          description: schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
    post:
      tags: [missions]
      summary: Create a schedule (operator)
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, cadence]
              properties:
                templateId: { type: string }
                cadence: { $ref: "#/components/schemas/Cadence" }
                assign: { type: object, additionalProperties: true, description: "{kind: auto} or {kind: robot, robotId}" }
                priority: { type: integer, enum: [1, 2, 3] }
                enabled: { type: boolean }
      responses:
        "200":
          description: created — live immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { $ref: "#/components/schemas/Schedule" }
        "400": { description: "templateId and cadence required, or invalid cadence (weekly needs at HH:MM + days 0-6; interval needs a positive everyMin)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: unknown template }
  /api/sites/{siteId}/schedules/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [missions]
      summary: Patch a schedule (enable/disable, cadence, assign)
      operationId: patchSchedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                cadence: { $ref: "#/components/schemas/Cadence" }
                assign: { type: object, additionalProperties: true }
                priority: { type: integer, enum: [1, 2, 3] }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { $ref: "#/components/schemas/Schedule" }
        "400": { description: "invalid cadence (weekly needs at HH:MM + days 0-6; interval needs a positive everyMin)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete: { tags: [missions], summary: Delete a schedule, operationId: deleteSchedule, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/events:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { name: limit, in: query, schema: { type: integer, default: 120, minimum: 1, maximum: 500 } }
    get:
      tags: [events]
      summary: Event stream (newest first)
      operationId: siteEvents
      responses:
        "200": { description: events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/Event" } } } } } } }

  /api/sites/{siteId}/events/{id}/ack:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [events], summary: Acknowledge (operator), operationId: ackEvent, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/events/{id}/resolve:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [events], summary: Resolve (operator), operationId: resolveEvent, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/events/{id}/dismiss:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    post: { tags: [events], summary: Dismiss — evidence retained for export (operator), operationId: dismissEvent, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/events/export:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { name: lifecycle, in: query, schema: { type: string, enum: [new, acked, resolved, dismissed] } }
    get:
      tags: [events]
      summary: Export events (e.g. dismissed → negative training samples)
      operationId: exportEvents
      responses: { "200": { description: export payload } }

  /api/sites/{siteId}/rules:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get: { tags: [events], summary: Detectors (rules), operationId: listRules, responses: { "200": { description: rules } } }
    post:
      tags: [events]
      summary: Create a detector (admin) — CV rule or metric threshold
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                model: { type: string, description: event-type id }
                source: { type: string, description: stream key }
                zone: { type: string }
                threshold: { type: number }
                severity: { type: string, enum: [critical, high, info, low] }
                robotId: { type: string }
                metric: { type: string, description: threshold detectors }
                op: { type: string, enum: [">", "<"] }
                bound: { type: number }
      responses: { "200": { description: created }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/sites/{siteId}/rules/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [events]
      summary: Patch a detector (enable/threshold/severity/bound)
      operationId: patchRule
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { "200": { description: updated }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete: { tags: [events], summary: Delete a detector (admin), operationId: deleteRule, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/event-types:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get: { tags: [events], summary: Event vocabulary, operationId: listEventTypes, responses: { "200": { description: types } } }
    post:
      tags: [events]
      summary: Register a custom event type (admin)
      operationId: createEventType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, label]
              properties:
                id: { type: string }
                label: { type: string }
                severity: { type: string, enum: [critical, high, info, low] }
                detail: { type: string }
                category: { type: string, enum: [security, fire, env, equipment, robot-fault] }
      responses: { "200": { description: registered }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/sites/{siteId}/event-types/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    delete: { tags: [events], summary: Delete a custom type, operationId: deleteEventType, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }

  /api/sites/{siteId}/channels:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [media]
      summary: Video channels (source URLs redacted)
      operationId: siteChannels
      responses: { "200": { description: channels, content: { application/json: { schema: { type: object, properties: { channels: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } } }

  /api/sites/{siteId}/robots/{id}/channels:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/robotId" }]
    get:
      tags: [media]
      summary: One robot's channels
      operationId: robotChannels
      responses: { "200": { description: channels } }

  /api/sites/{siteId}/channels/{chId}/sessions:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { name: chId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [media]
      summary: Open a playback lease (file → static url · rtsp → go2rtc MSE name)
      operationId: openStreamSession
      responses:
        "200": { description: session, content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/StreamSession" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/stream-sessions/{sid}/renew:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { name: sid, in: path, required: true, schema: { type: string } }]
    post: { tags: [media], summary: Renew a lease (+120 s), operationId: renewStreamSession, responses: { "200": { description: renewed }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/stream-sessions/{sid}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { name: sid, in: path, required: true, schema: { type: string } }]
    delete: { tags: [media], summary: Close a lease, operationId: closeStreamSession, responses: { "200": { $ref: "#/components/responses/Ok" } } }

  /api/sites/{siteId}/channels/{chId}/snapshot:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { name: chId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [media]
      summary: Live snapshot JPEG (ffmpeg — file seek or direct RTSP grab)
      operationId: channelSnapshot
      responses:
        "200": { description: JPEG, content: { image/jpeg: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: snapshot unavailable }

  /api/snapshots/{file}:
    parameters: [{ name: file, in: path, required: true, schema: { type: string } }]
    get:
      tags: [media]
      security: []
      summary: Stored evidence snapshot
      operationId: snapshotFile
      responses:
        "200": { description: JPEG, content: { image/jpeg: {} } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/api-keys:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [integrations]
      summary: List integration keys (admin — prefixes only)
      operationId: listApiKeys
      responses:
        "200":
          description: keys (metadata only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      summary: Issue a site key (admin) — plaintext returned exactly once
      operationId: createApiKey
      requestBody: { content: { application/json: { schema: { type: object, properties: { label: { type: string } } } } } }
      responses:
        "200":
          description: the new key — `key` (plaintext) appears only in this response
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    allOf:
                      - { $ref: "#/components/schemas/ApiKey" }
                      - type: object
                        properties:
                          key: { type: string, description: full plaintext key (shown once) }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/sites/{siteId}/api-keys/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    delete: { tags: [integrations], summary: Revoke a key (admin), operationId: deleteApiKey, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" } } }

  /api/sites/{siteId}/integrations:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [integrations]
      summary: Integration console summary (admin)
      operationId: integrationsSummary
      responses:
        "200":
          description: keys, event vocabulary, external units, recent orders, map + relay status
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
                  eventTypes: { type: array, items: { type: object, additionalProperties: true } }
                  externals:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        serial: { type: string }
                        callsign: { type: string }
                        model: { type: string }
                        level: { type: string, enum: [state-only, dispatchable] }
                        lastSeen: { type: integer }
                        online: { type: boolean }
                        mode: { type: string }
                  orders: { type: array, items: { type: object, additionalProperties: true }, description: last 30, newest-first }
                  map:
                    type: object
                    nullable: true
                    description: the site's base-map metadata (ROS map_server convention), or null
                    additionalProperties: true
                    properties:
                      image: { type: string }
                      resolution: { type: number }
                      width: { type: integer }
                      height: { type: integer }
                      origin: { type: array, items: { type: number } }
                      source: { type: string }
                  relay: { type: boolean, description: MEDIA_RELAY configured }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/sites/{siteId}/connectors:
    parameters: [{ $ref: "#/components/parameters/siteId" }]
    get:
      tags: [integrations]
      summary: Managed connectors + vendor catalog (admin)
      operationId: listConnectors
      responses:
        "200":
          description: connectors (with runtime) + the vendor catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors: { type: array, items: { $ref: "#/components/schemas/Connector" } }
                  catalog: { type: array, items: { type: object, additionalProperties: true } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      summary: Create + start a managed connector (admin)
      operationId: createConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, config]
              properties:
                vendor: { type: string, enum: [spot, deeprobotics, gosuncn] }
                name: { type: string }
                config: { type: object, additionalProperties: true, description: "vendor form fields + serial/callsign + streams[]" }
      responses:
        "200": { $ref: "#/components/responses/ConnectorEnvelope" }
        "400": { description: invalid config }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/sites/{siteId}/connectors/{id}:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [integrations]
      summary: Update connector config (admin — restarts the child)
      operationId: patchConnector
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { $ref: "#/components/responses/ConnectorEnvelope" }
        "400": { description: invalid config }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete: { tags: [integrations], summary: Delete a connector (stops the child), operationId: deleteConnector, responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/sites/{siteId}/connectors/{id}/{action}:
    parameters:
      - { $ref: "#/components/parameters/siteId" }
      - { $ref: "#/components/parameters/id" }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
    post:
      tags: [integrations]
      summary: Connector lifecycle (admin)
      operationId: connectorAction
      responses:
        "200": { $ref: "#/components/responses/ConnectorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: unknown connector or unknown action }
  /api/sites/{siteId}/connectors/{id}/logs:
    parameters: [{ $ref: "#/components/parameters/siteId" }, { $ref: "#/components/parameters/id" }]
    get:
      tags: [integrations]
      summary: "Connector log ring (last 200 lines, admin)"
      operationId: connectorLogs
      responses:
        "200":
          description: log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sites/{siteId}/recording-policies:
    parameters:
      - $ref: "#/components/parameters/siteId"
    get:
      tags:
        - media
      summary: Recording policy and truthful worker status for each channel
      responses:
        "200":
          description: Settings; enabled means requested, recording means at least one completed segment
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordingPolicy"
                  segmentSeconds:
                    type: number
                  maxStorageMB:
                    type: number
        "404":
          description: Unknown site
  /api/sites/{siteId}/recording-policies/{chId}:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: chId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - media
      summary: Enable/disable recording and set retention (admin)
      security:
        - cookieAuth: []
      description: Opt-in local FFmpeg archive for RTSP or local file sources. Maximum 8 enabled channels across the
        instance. 1–30 retention days; completed and active files share PB_RECORDING_MAX_MB budget. Stopping
        leaves completed history. Deleted sources may only be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
                - retentionDays
              properties:
                enabled:
                  type: boolean
                retentionDays:
                  type: integer
                  minimum: 1
                  maximum: 30
      responses:
        "200":
          description: Policy saved
        "400":
          description: Invalid policy
        "401":
          description: Login required
        "403":
          description: Admin required
        "404":
          description: Unknown site/channel
        "409":
          description: Recording channel limit reached
        "422":
          description: Unsupported source
  /api/sites/{siteId}/recordings:
    parameters:
      - $ref: "#/components/parameters/siteId"
    get:
      tags:
        - media
      summary: Search completed recordings by channel and overlapping time interval
      parameters:
        - name: channelId
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            description: Epoch ms, inclusive; defaults to 0
        - name: until
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            description: Epoch ms, inclusive; defaults to now
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Newest recordings first
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recording"
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        "400":
          description: Invalid range or pagination
        "404":
          description: Unknown site
  /api/sites/{siteId}/recordings/{id}/video:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - media
      summary: Play or download a completed MP4; private deployments require session
      description: Accepts a single byte Range including suffix ranges. URL carries PUBLIC_BASE. PB_PUBLIC_VIEW=0
        protects both playback and download. File may expire under retention.
      parameters:
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum:
              - "1"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: bytes=0-1023
      responses:
        "200":
          description: Full video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content, Content-Range and Accept-Ranges headers
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Login required in private deployment
        "404":
          description: Not found or expired
        "416":
          description: Invalid or unsatisfiable byte range
  /api/sites/{siteId}/recordings/{id}:
    parameters:
      - $ref: "#/components/parameters/siteId"
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - media
      security:
        - cookieAuth: []
      summary: Delete a recording file and its index (admin)
      responses:
        "200":
          description: Deleted
        "401":
          description: Login required
        "403":
          description: Admin required
        "404":
          description: Not found
        "500":
          description: File deletion failed; record is retained
  /api/sites/{siteId}/assets:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - site
      summary: List assets
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InspectionAsset"
        "404":
          description: Site or record not found
    post:
      tags:
        - site
      summary: Create assets (admin)
      description: Equipment inspected by robots; the record belongs to the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/InspectionAssetInput"
                - required:
                    - name
                    - kind
      responses:
        "201":
          description: Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionAsset"
        "400":
          description: Invalid fields, references or transition preconditions
        "401":
          description: Sign-in required
        "403":
          description: Insufficient site role
        "404":
          description: Site or record not found
        "409":
          description: Duplicate name, referenced record or closed defect conflict
      security:
        - cookieAuth: []
  /api/sites/{siteId}/assets/{id}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - site
      summary: Update assets (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionAssetInput"
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionAsset"
        "400":
          description: Invalid fields, references or transition preconditions
        "401":
          description: Sign-in required
        "403":
          description: Insufficient site role
        "404":
          description: Site or record not found
        "409":
          description: Duplicate name, referenced record or closed defect conflict
      security:
        - cookieAuth: []
    delete:
      tags:
        - site
      summary: Delete unreferenced assets (admin)
      description: References from tags or defect history prevent deletion. Site deletion cascades these records.
      responses:
        "200":
          description: Deleted
        "400":
          description: Invalid fields, references or transition preconditions
        "401":
          description: Sign-in required
        "403":
          description: Insufficient site role
        "404":
          description: Site or record not found
        "409":
          description: Duplicate name, referenced record or closed defect conflict
      security:
        - cookieAuth: []
