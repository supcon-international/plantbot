  /api/sites/{siteId}/mission-archive:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - missions
      summary: Query durable inspection runs beyond the runtime history window
      description: Creation timestamps use an inclusive from and exclusive to range in epoch milliseconds. Defaults
        to the last 30 days through tomorrow. Public viewer access follows PB_PUBLIC_VIEW.
      parameters:
        - name: from
          in: query
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - active
              - done
              - failed
              - aborted
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Persisted records, newest creation first
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mission"
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        "400":
          description: Invalid date range or status
        "401":
          description: Sign in required when public viewing is disabled
        "404":
          description: Site not loaded
  /api/sites/{siteId}/mission-archive/{id}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - missions
      summary: Read a persisted inspection run and all events explicitly linked by runId
      responses:
        "200":
          description: Run and its linked events; no runtime ring-buffer limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission:
                    $ref: "#/components/schemas/Mission"
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          description: Site or run not found
  /api/sites/{siteId}/mission-archive/{id}/report:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - missions
      summary: Export a printable report or spreadsheet-safe UTF-8 CSV
      description: Contains run metadata, planned actions, actual results and linked events. HTML has escaped
        content and a restrictive CSP; CSV includes a UTF-8 BOM and neutralizes formula prefixes. No missing
        result is inferred as successful. Timestamps in reports use UTC. Exports are included in the operation
        audit.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - html
              - csv
            default: html
      responses:
        "200":
          description: Printable HTML or CSV attachment
          content:
            text/html:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        "400":
          description: Unsupported format
        "404":
          description: Site or run not found
  /api/sites/{siteId}/mission-calendar:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - missions
      summary: Compare projected future schedule occurrences and actual created runs
      description: Range must be no more than 45 days. Future occurrences are estimates based on enabled schedules,
        not dispatched runs. Actual entries come from persistent missions. Up to 5000 planned and 5000 actual
        entries are returned; truncated is explicit. Weekly schedules use the server time zone, returned as
        timeZone.
      parameters:
        - name: from
          in: query
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Entries ordered by timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/MissionCalendarEntry"
                  truncated:
                    type: boolean
                  timeZone:
                    type: string
        "400":
          description: Invalid range or range longer than 45 days
        "404":
          description: Site not loaded
