            type: integer
            minimum: 0
        - name: actor
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - all
              - login
              - operation
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit records and pagination metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
